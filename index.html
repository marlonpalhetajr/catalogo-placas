<!DOCTYPE html>
        <!--Informa ao navegador que este documento utiliza o HTML5.
        Sem isso, alguns navegadores entram em um modo de compatibilidade e podem renderizar a página de forma diferente. -->
<html lang="pt-BR">
        <!--É o elemento raiz da página.
        O atributo lang informa que o idioma principal é português do Brasil.-->
    <head>
        <!--Tudo que fica aqui não aparece diretamente na tela, mas é importante para o navegador.-->
        <meta charset="UTF-8">
        <!--Define a codificação dos caracteres.
        Graças a ela, palavras como:
            Informação
            Decoração
            Coração
        aparecem corretamente.-->
        <meta nome="viewport" content="width=devide-width, initial-scale=1.0">
        <!--Sem ela, o celular tenta exibir o site como se fosse um computador, com ela, o layout fica responsivo.-->
        <title>
            Mjota Placas Decorativas
        </title>
        <!--É o texto que aparece na aba do navegador.-->
        <link rel="stylesheet" href="css/style.css">
        <!--Conecta o HTML ao CSS.
        O navegador lê o HTML e depois aplica os estilos definidos em style.css-->
    </head>
    <body>
        <!--Tudo que fica aqui aparece para o usuário.
        É onde construiremos nosso catálogo.-->
        <header>
        <!--É o cabeçalho da página.-->
            <h1>Mjota Placas Decorativas</h1>
            <p>Encontre a arte perfeita para a sua decoração.</p>
        </header>
        <main>
        <!--É o conteúdo principal da página.
        Dentro dele ficará toda a galeria de artes-->
        </main>
        <script src="js/script.js"></script>
        <!--Carrega o JavaScript
        Colocamos no final do body poque, quando ele for executado, os elementos da página já terão sido carregados.-->
    </body>
        
</html>
